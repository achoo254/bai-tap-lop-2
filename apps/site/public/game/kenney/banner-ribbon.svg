<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Dải ruy băng hoàng gia (Kenney style) -->
  <!-- Đuôi dải băng trái gấp nếp -->
  <polygon points="10,18 40,18 40,46 10,46 22,32" fill="#b45309" stroke="#451a03" stroke-width="3" stroke-linejoin="round" />
  <polygon points="40,36 40,46 48,36" fill="#78350f" stroke="#451a03" stroke-width="2" />

  <!-- Đuôi dải băng phải gấp nếp -->
  <polygon points="230,18 200,18 200,46 230,46 218,32" fill="#b45309" stroke="#451a03" stroke-width="3" stroke-linejoin="round" />
  <polygon points="200,36 200,46 192,36" fill="#78350f" stroke="#451a03" stroke-width="2" />

  <!-- Thân dải ruy băng chính giữa -->
  <rect x="36" y="8" width="168" height="38" rx="6" fill="#facc15" stroke="#451a03" stroke-width="3.5" />
  <rect x="40" y="12" width="160" height="12" rx="3" fill="#fef08a" opacity="0.8" />
</svg>
